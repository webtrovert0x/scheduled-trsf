<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#191c24" />
      <stop offset="85%" stop-color="#0c0d11" />
      <stop offset="100%" stop-color="#07080a" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="35%" stop-color="#f5b300" />
      <stop offset="70%" stop-color="#cc9200" />
      <stop offset="100%" stop-color="#ffdf73" />
    </linearGradient>

    <linearGradient id="goldCore" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff2b3" />
      <stop offset="50%" stop-color="#f5b300" />
      <stop offset="100%" stop-color="#d49000" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f5b300" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Shield Base -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="2.5" />

  <!-- Outer Orbit Track / Chrono Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="rgba(245, 179, 0, 0.15)" stroke-width="3" stroke-dasharray="6 8" />
  <circle cx="100" cy="100" r="66" fill="none" stroke="rgba(245, 179, 0, 0.25)" stroke-width="1.5" />

  <!-- 4 Cardinal BotChain Nodes -->
  <circle cx="100" cy="24" r="4.5" fill="#f5b300" filter="url(#coreGlow)" />
  <circle cx="176" cy="100" r="4.5" fill="#f5b300" filter="url(#coreGlow)" />
  <circle cx="100" cy="176" r="4.5" fill="#f5b300" filter="url(#coreGlow)" />
  <circle cx="24" cy="100" r="4.5" fill="#f5b300" filter="url(#coreGlow)" />

  <!-- Dynamic Scheduled Transfer Arc (Clockwise Motion) -->
  <path d="M 60 48 A 66 66 0 1 1 152 140" fill="none" stroke="url(#goldRim)" stroke-width="6" stroke-linecap="round" filter="url(#coreGlow)" />

  <!-- Futuristic Bot 'B' / Time Dial Monogram -->
  <!-- Vertical Stem -->
  <path d="M 72 62 L 72 138" stroke="url(#goldCore)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Upper Loop -->
  <path d="M 72 62 L 102 62 C 118 62 128 72 128 85 C 128 98 118 100 102 100 L 72 100" fill="none" stroke="url(#goldCore)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Lower Loop with Forward Scheduled Velocity Arrow -->
  <path d="M 72 100 L 106 100 C 124 100 136 112 136 126 C 136 138 124 138 106 138 L 72 138" fill="none" stroke="url(#goldCore)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Fast Forward Execution Chevron / Arrow -->
  <path d="M 132 94 L 148 100 L 132 106" fill="none" stroke="url(#arrowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
  <path d="M 144 94 L 160 100 L 144 106" fill="none" stroke="#ffe082" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />

  <!-- Center Clock Pivot / Pulsing Core -->
  <circle cx="100" cy="100" r="5" fill="#ffffff" filter="url(#goldGlow)" />
</svg>
